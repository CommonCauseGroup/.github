<?xml version="1.0" encoding="UTF-8"?>
<!--
The horizontal lockup — the default signature.

  The mark's optical diameter is D. Everything else in this file is a ratio of
  it — cap height 0.470D, gap 0.300D — so the lockup is correct at any
  size and can be rebuilt at any other proportion by changing one number in
  tools/build_logo.py.

  Clear space is one ring weight (49 units at this file's scale, or
  0.17D) on every side. Nothing sets inside it: no text, no rule, no edge of a
  card, no other logo.

  Minimum width: 120px. Below that, drop the wordmark and use the mark alone.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2068.96 340" width="2068.96" height="340">
  <title>Common Cause</title>
  <defs>
    <!--
      The outer ring cools as it descends: light purple at the top terminal,
      royal purple across the shoulder, blue down the flank, teal at the foot.
      A linear gradient cannot follow a 268-degree arc, so it runs upper-right
      to lower-left, which is the axis the eye actually travels along a C.
    -->
    <linearGradient id="ccl-ring" x1="0.68" y1="0" x2="0.24" y2="1">
      <stop offset="0" stop-color="#cdbdff"/>
      <stop offset="0.32" stop-color="#7c5cf0"/>
      <stop offset="0.66" stop-color="#4c6fd6"/>
      <stop offset="1" stop-color="#3dbcc9"/>
    </linearGradient>
    <!-- The one warm note. Amber into coral, across the inner arc. -->
    <linearGradient id="ccl-core" x1="0.15" y1="0.1" x2="0.9" y2="0.95">
      <stop offset="0" stop-color="#ffb95c"/>
      <stop offset="1" stop-color="#f2705d"/>
    </linearGradient>
  </defs>
  <g transform="translate(0 0) scale(0.85) translate(-30 -30)">
    <path fill="url(#ccl-ring)" d="M 318.09 322.29 A 170 170 0 1 1 318.09 77.71 L 277.8 119.43 A 112 112 0 1 0 277.8 280.57 Z"/>
    <path fill="url(#ccl-core)" d="M 254.18 256.11 A 78 78 0 1 1 254.18 143.89 L 223.62 175.54 A 34 34 0 1 0 223.62 224.46 Z"/>
  </g>
